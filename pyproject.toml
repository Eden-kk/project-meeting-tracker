[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "storage-router"
version = "0.1.0"
description = "Tracker storage-router (Worktree D) — FastAPI artifact router + storage."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.32.1",
  "sqlalchemy==2.0.36",
  "alembic==1.13.3",
  "psycopg[binary]==3.2.3",
  "pydantic==2.9.2",
  "pydantic-settings==2.6.1",
  "python-multipart==0.0.12",
  "python-dotenv==1.0.1",
  # hermes_plugin is imported in-process by storage_router.hermes_runtime,
  # so its runtime deps belong here — `pip install -e .` must be enough to
  # run finalize + QA. These previously lived only in the `hermes` extra,
  # which the documented `pip install -e '.[dev]'` never pulled, so every
  # finalize 500'd on the pod with ModuleNotFoundError (openai/anthropic).
  "httpx==0.27.2",
  "pyyaml>=6.0,<7",
  "anthropic>=0.39,<0.50",
  "openai>=1.50.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "pytest-asyncio==0.24.0",
  "ruff==0.7.1",
  "datamodel-code-generator==0.26.3",
]
# Retained for installing the hermes plugin standalone. The storage-router
# itself no longer needs this extra — the deps moved into `dependencies`.
hermes = [
  "pyyaml>=6.0,<7",
  "anthropic>=0.39,<0.50",
  "openai>=1.50.0",
]

[project.scripts]
storage-router = "storage_router.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "ignore::DeprecationWarning",
]
