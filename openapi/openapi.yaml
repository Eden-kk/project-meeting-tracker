openapi: 3.0.3
info:
  title: Tracker API — Phase 3 + Wave 4 surface
  version: 0.6.0
  description: |
    Phase-3 redesign: the memory-card user-curation state machine has been
    removed. There is no `state` enum, no `needs_review` flag, no
    PATCH/commit/reject routes. Cards are live as soon as the agent creates
    them; quality is owned by the audit + consolidation passes which write
    `confidence`, `hidden_at`, `superseded_by_id`, and `audit_reason`.
    The list endpoint hides agent-soft-deleted / superseded rows by default.

    Wave 2 (this version) adds the agent quality endpoints:
      * PATCH /api/memory-cards/{id}/confidence — audit pass downgrades a card
      * POST  /api/memory-cards/{id}/hide       — audit pass soft-deletes a card
      * POST  /api/memory-cards/{loser}/supersede-into/{winner} — consolidation merge

    Wave 4 adds cross-meeting recall: Postgres FTS over speaker_segments
    (4.1) and memory_cards (4.2) under `/api/search/*`, plus a workspace-
    wide Hermes Q&A endpoint at `/api/qa/workspace` (4.3).

servers:
  - url: http://localhost:8000

paths:
  /api/conversations/import:
    post:
      summary: Import a conversation (voice file, transcript file, or pasted text)
      description: |
        Single entrance for all imported conversations. The router (worktree D)
        inspects the request, persists a ConversationArtifact + Meeting,
        and dispatches to the voice-ingest pipeline (worktree B) or the
        transcript-ingest pipeline (worktree C).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              description: "Server enforces: exactly one of voice_file, transcript_file, or pasted_transcript MUST be provided. OpenAPI 3.0 cannot express this constraint at the schema level; the server returns 400 'no_input' if zero are provided and 400 'multiple_inputs' if more than one is provided."
              required: [workspace_id, title]
              properties:
                workspace_id:
                  type: string
                title:
                  type: string
                visibility:
                  type: string
                  enum: [private, workspace, shared]
                  default: private
                labels:
                  type: array
                  items: { type: string }
                voice_file:
                  type: string
                  format: binary
                  description: Audio file. Use this OR transcript_file OR pasted_transcript.
                transcript_file:
                  type: string
                  format: binary
                pasted_transcript:
                  type: string
      responses:
        '202':
          description: Accepted; processing begins asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportAccepted'
        '400':
          description: "Invalid input. Codes: no_input (zero body parts present), multiple_inputs (more than one body part present), invalid_format (unsupported file type)."

  /api/meetings:
    get:
      summary: List meetings for a workspace
      parameters:
        - in: query
          name: workspace_id
          required: true
          schema: { type: string }
        - in: query
          name: limit
          required: false
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
        - in: query
          name: offset
          required: false
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Meeting' }
                  total: { type: integer, minimum: 0 }

  /api/meetings/{id}:
    get:
      summary: Get a meeting record
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meeting'
        '404':
          description: Not found

    delete:
      summary: Soft-delete a meeting
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Meeting soft-deleted
          content:
            application/json:
              schema:
                type: object
                required: [meeting_id, deleted_at, blob_removed]
                properties:
                  meeting_id:   { type: string }
                  deleted_at:   { type: string, format: date-time }
                  blob_removed: { type: boolean }
        '404':
          description: Meeting not found
        '409':
          description: Meeting already deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:    { type: string, example: already_deleted }
                      message: { type: string }

  /api/meetings/{id}/transcript:
    get:
      summary: Get the normalized transcript for a meeting
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NormalizedTranscript'
        '404':
          description: Not found
        '409':
          description: Meeting exists but transcript not yet ready.

  /api/memory-cards:
    post:
      summary: Create a memory card
      description: |
        Inserts a new MemoryCard. The server assigns `memory_card_id` and
        timestamps. Phase-3 redesign: there is no `state` machine; the card
        is live the moment it lands. Returns 404 if `meeting_id` is unknown.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryCardCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryCard'
        '404':
          description: Meeting not found
        '422':
          description: Validation error

  /api/meetings/{id}/memory-cards:
    get:
      summary: List memory cards for a meeting
      description: |
        By default returns only visible cards (`hidden_at IS NULL`). Set
        `include_hidden=true` for admin / audit views.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: type
          required: false
          schema:
            type: string
            enum: [decision, action_item, pain_point, quote, requirement, risk, open_question, technical_detail]
        - in: query
          name: include_hidden
          required: false
          schema: { type: boolean, default: false }
        - in: query
          name: limit
          required: false
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
        - in: query
          name: offset
          required: false
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryCardListResponse'
        '404':
          description: Meeting not found

  /api/memory-cards/{id}/confidence:
    patch:
      summary: Update a card's confidence (audit pass)
      description: |
        Wave 2.1. Called by the meeting-card-audit skill to downgrade
        weakly-supported cards. Sets `confidence` and (optionally) the
        free-text `audit_reason`.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryCardConfidencePatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryCard'
        '404':
          description: Card not found
        '422':
          description: Validation error

  /api/memory-cards/{id}/hide:
    post:
      summary: Soft-delete a card (audit pass)
      description: |
        Wave 2.1. Sets `hidden_at = NOW()` and persists the reason
        to `audit_reason`. Idempotent; calling twice does not flip the
        timestamp.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryCardHideRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryCard'
        '404':
          description: Card not found

  /api/memory-cards/{loser_id}/supersede-into/{winner_id}:
    post:
      summary: Merge a near-duplicate card into a canonical winner (consolidation pass)
      description: |
        Wave 2.2. Validates that both cards belong to the same meeting,
        neither is already hidden, and the winner is not itself
        superseded. Hides the loser, points its `superseded_by_id` at
        the winner, and appends the loser's `source_chunk_ids` to the
        winner (deduplicated).
      parameters:
        - in: path
          name: loser_id
          required: true
          schema: { type: string }
        - in: path
          name: winner_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupersedeResponse'
        '404':
          description: Card not found
        '409':
          description: Merge precondition failed

  /api/meetings/{id}/finalize:
    post:
      summary: Finalize a meeting via Hermes
      description: |
        Runs `hermes_plugin.meeting_finalization`, persists returned cards as
        `draft` MemoryCards, marks the meeting `finalized`, and returns a summary.
        Synchronous in Phase 2; long-running calls block. For timestamped
        transcripts the plugin chunks the meeting into `chunk_minutes`-sized
        windows and runs one Claude pass per window so long meetings don't
        exceed the model context budget.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: chunk_minutes
          required: false
          description: |
            Time-window size (in minutes) used by the chunked extractor.
            Out-of-range values return 422. Untimestamped transcripts fall
            back to single-pass finalization regardless of this value.
          schema:
            type: integer
            minimum: 1
            maximum: 30
            default: 5
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalizeResponse'
        '404':
          description: Meeting not found
        '409':
          description: Meeting already finalized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlreadyFinalized'
        '503':
          description: Hermes plugin unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HermesUnavailable'

  /api/qa/meeting:
    post:
      summary: Ask a question about a single meeting (Hermes-backed)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QARequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QAResponse'
        '404':
          description: Meeting not found
        '422':
          description: Validation error
        '503':
          description: Hermes plugin unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HermesUnavailable'

  /api/search/transcripts:
    get:
      summary: Cross-meeting keyword search over transcript segments (Wave 4.1)
      description: |
        Postgres FTS over `speaker_segments.text` (English config). Hits link
        back to the originating meeting + segment. Scoped to a workspace.
        When `q` is omitted, returns the most recent segments in the
        workspace (no FTS ranking; rank=0, snippet empty).
      parameters:
        - in: query
          name: q
          required: false
          schema: { type: string, maxLength: 500 }
        - in: query
          name: workspace_id
          required: true
          schema: { type: string }
        - in: query
          name: limit
          required: false
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
        - in: query
          name: offset
          required: false
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptSearchResponse'
        '422':
          description: Validation error

  /api/search/cards:
    get:
      summary: Cross-meeting keyword search over memory cards (Wave 4.2)
      description: |
        Postgres FTS over `memory_cards.title || ' ' || content` (English
        config). Honors `hidden_at IS NULL` (the agent's soft-delete flag).
        Optional `type` filter narrows to a single card type. When `q` is
        omitted, returns the highest-confidence / most recent cards
        matching the remaining filters (workspace, optional type) — used
        by the `workspace-qa` skill for general project-progress
        questions.
      parameters:
        - in: query
          name: q
          required: false
          schema: { type: string, maxLength: 500 }
        - in: query
          name: workspace_id
          required: true
          schema: { type: string }
        - in: query
          name: type
          required: false
          schema:
            type: string
            enum: [decision, action_item, pain_point, quote, requirement, risk, open_question, technical_detail]
        - in: query
          name: limit
          required: false
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
        - in: query
          name: offset
          required: false
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardSearchResponse'
        '422':
          description: Validation error

  /api/qa/workspace:
    post:
      summary: Ask a question across every meeting in a workspace (Wave 4.3)
      description: |
        Hermes drives the answer via the `workspace-qa` skill, which is
        bound to `search_workspace_transcripts` + `search_workspace_cards`.
        The skill emits inline citations in the form
        `[meeting:<id>:card:<id>]` or `[meeting:<id>:seg:<id>]`; this
        route parses them out of the final answer so the SPA can render
        deep links.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceQARequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceQAResponse'
        '422':
          description: Validation error
        '503':
          description: Hermes plugin unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HermesUnavailable'

  # --- Phase 2+ endpoints not yet defined in this spec --------------------
  # POST /api/live-meetings/start
  # POST /api/live-meetings/{id}/audio-frame
  # POST /api/live-meetings/{id}/stop
  # POST /api/zoom/rtms/webhook
  # GET  /api/meetings/{id}/chunks
  # GET  /api/hermes/live-meetings/{id}/state
  # GET  /api/hermes/meetings/{id}/recent-chunks
  # POST /api/hermes/meetings/{id}/pattern
  # POST /api/hermes/meetings/{id}/schema
  # POST /api/hermes/memory-cards
  # POST /api/hermes/meetings/{id}/finalize
  # ------------------------------------------------------------------------

  /api/zoom-bot/dispatch:
    post:
      summary: Dispatch a headless Hermes bot to a Zoom meeting URL.
      description: |
        Creates a `MeetingRow` with `source_type='zoom_bot'` and asks the
        bot dispatcher to spawn a subprocess that joins the Zoom call,
        captures audio, and uploads chunks to
        `POST /api/live-meetings/{id}/audio-chunk` (the same endpoint the
        browser-mic flow uses).

        Returns 503 with `error.code='zoom_creds_missing'` when the four
        Zoom Marketplace env vars are absent, or `bot_pool_full` when the
        per-pod cap (`ZOOM_BOT_POOL_SIZE`, default 3) is saturated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspace_id, zoom_url]
              additionalProperties: false
              properties:
                workspace_id: { type: string, minLength: 1, maxLength: 64 }
                zoom_url: { type: string, minLength: 10, maxLength: 2048 }
                title: { type: string, maxLength: 200, default: "Zoom meeting" }
      responses:
        "201":
          description: Bot dispatched.
          content:
            application/json:
              schema:
                type: object
                required: [meeting_id, artifact_id, zoom_meeting_number, status]
                properties:
                  meeting_id: { type: string }
                  artifact_id: { type: string }
                  zoom_meeting_number: { type: string }
                  status: { type: string, enum: [live] }
        "400":
          description: Could not parse a meeting number from the URL.
        "503":
          description: |
            Either Marketplace credentials are missing
            (`error.code='zoom_creds_missing'`) or the bot pool is full
            (`error.code='bot_pool_full'`).

  /api/zoom-bot/sdk-jwt:
    post:
      summary: Sign a Meeting SDK JWT (HS256, ZOOM_SDK_SECRET) for the bot.
      description: |
        The bot's headless Chromium fetches this JWT before calling
        `ZoomMtg.join(...)`. The JWT is signed with `ZOOM_SDK_SECRET`
        ONLY — `ZOOM_OAUTH_CLIENT_SECRET` is reserved for the future
        user-grant flow and must NEVER sign Meeting SDK JWTs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [meeting_number]
              additionalProperties: false
              properties:
                meeting_number: { type: string, pattern: "^[0-9]+$" }
                role: { type: integer, enum: [0, 1], default: 0 }
      responses:
        "200":
          description: Fresh signature payload.
          content:
            application/json:
              schema:
                type: object
                required: [signature, sdk_key, meeting_number, role]
                properties:
                  signature: { type: string }
                  sdk_key: { type: string }
                  meeting_number: { type: string }
                  role: { type: integer }
        "503":
          description: Marketplace credentials not configured.

components:
  schemas:
    ImportAccepted:
      type: object
      required: [artifact_id, meeting_id, processing_status]
      properties:
        artifact_id: { type: string }
        meeting_id:  { type: string }
        processing_status:
          type: string
          description: At 202 time the artifact is always 'received'. Subsequent state transitions are observed via GET /api/meetings/{id}.
          enum: [received]

    Meeting:
      description: Mirrors schemas/meeting.schema.json
      type: object
      required: [meeting_id, artifact_id, title, status, evidence_quality]
      properties:
        meeting_id:        { type: string }
        artifact_id:       { type: string }
        title:             { type: string, default: '' }
        status:
          type: string
          enum: [live, processing, ready, finalizing, finalized, failed]
        started_at:        { type: string, format: date-time, nullable: true }
        ended_at:          { type: string, format: date-time, nullable: true }
        finalized_at:      { type: string, format: date-time, nullable: true }
        detected_pattern:  { $ref: '#/components/schemas/MeetingPattern', nullable: true }
        current_schema:    { type: object, nullable: true }
        evidence_quality:
          type: string
          enum: [unknown, high, medium, low, lowest]
        last_finalize_error:
          type: string
          nullable: true
          description: |
            Set by the auto-finalize background task when the Hermes call
            fails; status reverts to `ready` so the user can re-trigger.
        finalized_summary:
          type: string
          nullable: true
          description: |
            Single-narrative summary produced by the chunked-summarization
            pass during finalize; rendered as markdown by the SPA Summary tab.

    MeetingPattern:
      description: Mirrors schemas/meeting_pattern.schema.json
      type: object
      required: [primary_pattern, confidence]
      properties:
        primary_pattern:    { type: string }
        secondary_patterns:
          type: array
          items: { type: string }
        interaction_style: { type: string, nullable: true }
        confidence:        { type: number, minimum: 0, maximum: 1 }
        reason:            { type: string, nullable: true }

    NormalizedTranscript:
      description: Mirrors schemas/normalized_transcript.schema.json
      type: object
      required: [meeting_id, segments]
      properties:
        meeting_id: { type: string }
        segments:
          type: array
          items: { $ref: '#/components/schemas/SpeakerSegment' }

    SpeakerSegment:
      description: Mirrors schemas/speaker_segment.schema.json
      type: object
      required: [segment_id, text, is_final, source_type]
      properties:
        segment_id:   { type: string }
        speaker_id:   { type: string, nullable: true }
        speaker_name: { type: string, nullable: true }
        start_ms:     { type: integer, minimum: 0, nullable: true }
        end_ms:       { type: integer, minimum: 0, nullable: true }
        text:         { type: string }
        confidence:   { type: number, minimum: 0, maximum: 1, nullable: true }
        source_type:
          type: string
          enum: [live_voice, zoom_rtms, voice_file, transcript_file, pasted_transcript]
        is_final:     { type: boolean }

    MemoryCard:
      description: Mirrors schemas/memory_card.schema.json (Phase-3; no state, no needs_review).
      type: object
      required: [memory_card_id, meeting_id, type, title, content, source_chunk_ids, confidence]
      properties:
        memory_card_id:   { type: string, minLength: 1 }
        meeting_id:       { type: string, minLength: 1 }
        type:
          type: string
          enum: [decision, action_item, pain_point, quote, requirement, risk, open_question, technical_detail]
        title:            { type: string, minLength: 1, maxLength: 500 }
        content:          { type: string }
        source_chunk_ids:
          type: array
          items: { type: string }
          minItems: 1
        source_start_ms:  { type: integer, minimum: 0, nullable: true }
        source_end_ms:    { type: integer, minimum: 0, nullable: true }
        speakers_json:
          type: array
          items: { type: string }
          nullable: true
        confidence:       { type: number, minimum: 0, maximum: 1 }
        hidden_at:        { type: string, format: date-time, nullable: true, description: "Agent-driven soft delete; list endpoints hide these by default." }
        superseded_by_id: { type: string, nullable: true, description: "Canonical winner card from the agent consolidation pass." }
        audit_reason:     { type: string, nullable: true, description: "Rationale recorded by the audit pass when a card is downgraded or hidden." }
        created_by_agent: { type: string, nullable: true }
        created_at:       { type: string, format: date-time, nullable: true }
        updated_at:       { type: string, format: date-time, nullable: true }

    MemoryCardCreate:
      description: Request body for POST /api/memory-cards (also the per-card shape Hermes returns from meeting_finalization).
      type: object
      additionalProperties: false
      required: [meeting_id, type, title, content, source_chunk_ids, confidence]
      properties:
        meeting_id:       { type: string, minLength: 1 }
        type:
          type: string
          enum: [decision, action_item, pain_point, quote, requirement, risk, open_question, technical_detail]
        title:            { type: string, minLength: 1, maxLength: 500 }
        content:          { type: string }
        source_chunk_ids:
          type: array
          items: { type: string }
          minItems: 1
        source_start_ms:  { type: integer, minimum: 0, nullable: true }
        source_end_ms:    { type: integer, minimum: 0, nullable: true }
        speakers_json:
          type: array
          items: { type: string }
          nullable: true
        confidence:       { type: number, minimum: 0, maximum: 1 }
        created_by_agent: { type: string, nullable: true }

    MemoryCardListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MemoryCard' }
        total: { type: integer, minimum: 0 }

    AlreadyFinalized:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code]
          properties:
            code: { type: string, enum: [already_finalized] }

    HermesUnavailable:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:    { type: string, enum: [hermes_unavailable] }
            message: { type: string }

    MemoryCardConfidencePatch:
      type: object
      additionalProperties: false
      required: [confidence]
      properties:
        confidence: { type: number, minimum: 0, maximum: 1 }
        reason:     { type: string, nullable: true, maxLength: 2000 }

    MemoryCardHideRequest:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, nullable: true, maxLength: 2000 }

    SupersedeResponse:
      type: object
      additionalProperties: false
      required: [loser_id, winner_id, winner_source_chunk_ids]
      properties:
        loser_id:                { type: string }
        winner_id:               { type: string }
        winner_source_chunk_ids:
          type: array
          items: { type: string }

    FinalizeResponse:
      type: object
      required: [meeting_id, finalized_at, cards_created, summary]
      properties:
        meeting_id:    { type: string }
        finalized_at:  { type: string, format: date-time }
        cards_created: { type: integer, minimum: 0 }
        summary:       { type: string }
        chunks_processed:
          type: integer
          minimum: 0
          default: 1
          description: |
            Number of transcript chunks the chunked extractor processed.
            Defaults to 1 for the legacy single-pass finalization path.

    QARequest:
      type: object
      additionalProperties: false
      required: [meeting_id, question]
      properties:
        meeting_id: { type: string, minLength: 1 }
        question:   { type: string, minLength: 1, maxLength: 4000 }

    QAEvidenceItem:
      type: object
      required: [segment_id, speaker, text]
      properties:
        segment_id:    { type: string }
        speaker:       { type: string }
        text:          { type: string }
        start_ms:      { type: integer, default: 0, minimum: 0 }
        end_ms:        { type: integer, default: 0, minimum: 0 }

    QAResponse:
      type: object
      required: [answer, citations, weak_evidence]
      properties:
        answer:        { type: string }
        confidence:    { type: number, default: 0.85, minimum: 0.0, maximum: 1.0 }
        citations:
          type: array
          items: { $ref: '#/components/schemas/QAEvidenceItem' }
        weak_evidence: { type: boolean, default: false }

    TranscriptSearchHit:
      type: object
      additionalProperties: false
      required: [segment_id, meeting_id, meeting_title, text]
      properties:
        segment_id:    { type: string }
        meeting_id:    { type: string }
        meeting_title: { type: string }
        speaker:       { type: string, default: "" }
        start_ms:      { type: integer, default: 0, minimum: 0 }
        end_ms:        { type: integer, default: 0, minimum: 0 }
        text:          { type: string }
        snippet:       { type: string, default: "" }
        rank:          { type: number, default: 0.0 }

    TranscriptSearchResponse:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TranscriptSearchHit' }
        total: { type: integer, minimum: 0 }

    CardSearchHit:
      type: object
      additionalProperties: false
      required: [memory_card_id, meeting_id, meeting_title, type, title, content]
      properties:
        memory_card_id:  { type: string }
        meeting_id:      { type: string }
        meeting_title:   { type: string }
        type:
          type: string
          enum: [decision, action_item, pain_point, quote, requirement, risk, open_question, technical_detail]
        title:           { type: string }
        content:         { type: string }
        confidence:      { type: number, default: 0.0 }
        source_start_ms: { type: integer, nullable: true }
        source_end_ms:   { type: integer, nullable: true }
        snippet:         { type: string, default: "" }
        rank:            { type: number, default: 0.0 }

    CardSearchResponse:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CardSearchHit' }
        total: { type: integer, minimum: 0 }

    WorkspaceQARequest:
      type: object
      additionalProperties: false
      required: [workspace_id, question]
      properties:
        workspace_id: { type: string, minLength: 1 }
        question:     { type: string, minLength: 1, maxLength: 4000 }

    WorkspaceQACitation:
      type: object
      additionalProperties: false
      required: [meeting_id]
      properties:
        meeting_id:     { type: string }
        meeting_title:  { type: string, default: "" }
        memory_card_id: { type: string, nullable: true }
        segment_id:     { type: string, nullable: true }
        snippet:        { type: string, default: "" }

    WorkspaceQAResponse:
      type: object
      additionalProperties: false
      required: [answer, citations, weak_evidence]
      properties:
        answer:        { type: string }
        confidence:    { type: number, default: 0.6, minimum: 0.0, maximum: 1.0 }
        citations:
          type: array
          items: { $ref: '#/components/schemas/WorkspaceQACitation' }
        weak_evidence: { type: boolean, default: false }
